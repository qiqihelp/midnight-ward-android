name: Build APK (Pure C++)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: 桌面回归测试 + NDK 编译 + 打包 APK
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 选择 SDK 组件（NDK / build-tools / platform）
        run: |
          set -e
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "SDK=$SDK" >> "$GITHUB_ENV"
          # NDK：取 runner 自带最新版，缺失则安装
          NDK=$(ls -d "$SDK"/ndk/* 2>/dev/null | sort -V | tail -n1 || true)
          if [ -z "$NDK" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" >/dev/null
            NDK="$SDK/ndk/27.2.12479018"
          fi
          BT=$(ls -d "$SDK"/build-tools/* | sort -V | tail -n1)
          PLAT=$(ls -d "$SDK"/platforms/android-* | sort -V | tail -n1)
          echo "NDK=$NDK" >> "$GITHUB_ENV"
          echo "BT=$BT" >> "$GITHUB_ENV"
          echo "PLAT=$PLAT" >> "$GITHUB_ENV"
          echo "NDK=$NDK"
          echo "BT=$BT"
          echo "PLAT=$PLAT"

      - name: 桌面回归测试（无头通关 / 存档 / 模糊）
        run: |
          set -e
          bash scripts/build_desktop.sh fast
          ./build-desktop/mw --logic
          ./build-desktop/mw --saveload
          ./build-desktop/mw --fuzz --min 1 --seed 42

      - name: NDK 编译（arm64-v8a / armeabi-v7a / x86_64 / x86）
        run: |
          set -e
          NDK="$NDK" bash scripts/build_android.sh

      - name: 打包签名 APK
        run: |
          set -e
          BT="$BT" PLAT="$PLAT" bash scripts/package_apk.sh

      - name: 校验 APK
        run: |
          set -e
          "$BT/aapt2" dump badging MidnightWard-v2.0-cpp.apk | head -12
          echo "--- 横屏断言（screenOrientation 应出现在 badging）---"
          "$BT/aapt2" dump badging MidnightWard-v2.0-cpp.apk | rg "launchable-activity"
          "$BT/aapt2" dump xmltree --file AndroidManifest.xml MidnightWard-v2.0-cpp.apk | rg "screenOrientation"
          echo "--- 结构断言 ---"
          unzip -l MidnightWard-v2.0-cpp.apk | rg "libmidnight_ward.so"
          if unzip -l MidnightWard-v2.0-cpp.apk | rg -q "classes.dex"; then
            echo "错误：纯原生 APK 不应包含 DEX"; exit 1
          fi
          "$BT/apksigner" verify MidnightWard-v2.0-cpp.apk

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: midnight-ward-cpp-apk
          path: MidnightWard-v2.0-cpp.apk
          retention-days: 30
