name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: 编译《午夜病栋》APK
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 编译 Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 重命名 APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MidnightWard-v1.0.apk
          ls -lh MidnightWard-v1.0.apk

      - name: 校验 APK
        run: |
          ${ANDROID_HOME}/build-tools/34.0.0/aapt2 dump badging MidnightWard-v1.0.apk | head -8

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: MidnightWard-APK
          path: MidnightWard-v1.0.apk
          retention-days: 30
