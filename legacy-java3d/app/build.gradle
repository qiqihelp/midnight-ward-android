plugins {
    id 'com.android.application'
}

android {
    namespace 'com.midnight.ward'
    compileSdk 34

    defaultConfig {
        applicationId "com.midnight.ward"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// 本游戏零第三方依赖：纯 Android Framework + Java 实现
dependencies {
}
